[package]
name = "uncrx-rs"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
description = "Uncrx is a library that helps you convert a CRX Extension to a zip file that can be easily extracted."
readme = "README.md"
license = "MIT"
repository = "https://github.com/iltumio/uncrx-rs"

[features]
default = ["cli", "tui", "extract"]
cli = ["extract", "dep:clap"]
tui = ["cli", "dep:ratatui", "dep:crossterm"]
extract = ["dep:zip", "dep:tempfile"]

[dependencies]
anyhow = "1.0.104"
prost = "0.14"
clap = { version = "4.6.7", features = ["derive"], optional = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "0.29.0", optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"], optional = true }
tempfile = { version = "3.27.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[[bin]]
name = "uncrx"
path = "src/main.rs"
required-features = ["cli"]

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

[workspace.metadata.dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
