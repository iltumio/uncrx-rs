name: Web
on:
  pull_request:
  push:
    branches: [main]
  workflow_run:
    workflows: [Release]
    types: [completed]
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install verified Oranda 0.6.5 and build
        env:
          ORANDA_SHA256: 05171447b827f681ec19142d0bb983a8691f65c54820d821e66ee7a419fbd88b
        run: |
          curl --proto '=https' --tlsv1.2 -fLsS https://github.com/axodotdev/oranda/releases/download/v0.6.5/oranda-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/oranda.tar.gz"
          echo "$ORANDA_SHA256  $RUNNER_TEMP/oranda.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/oranda.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/oranda-x86_64-unknown-linux-musl/oranda" build
      - name: Prepare HTML for link checking
        run: |
          mkdir /tmp/public/
          cp -R public /tmp/public/uncrx-rs
          cp LICENSE /tmp/public/
          cp LICENSE /tmp/public/uncrx-rs/
          cp public/index.html /tmp/public/
      - uses: untitaker/hyperlink@9375bc4063712ad490d5eb3d54df0b6aade15e54 # 0.3.2
        with:
          args: /tmp/public/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website
          path: public/
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website
          path: public/
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: public
          token: ${{ secrets.GITHUB_TOKEN }}
          single-commit: true
